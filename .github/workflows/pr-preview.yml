name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  comment:
    # Commenting needs a write-scoped GITHUB_TOKEN, but pull requests opened from forks only get a
    # read-only one, so this job can only fail there with "Resource not accessible by integration".
    # The preview link would not work for forks either, since the branch only exists in the fork.
    # Skip it for forks; it still runs for same-repo pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment with StackBlitz preview link
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const url = `https://pr.new/github.com/${owner}/${repo}/tree/${branch}`;
            const marker = '<!-- pr-new-preview -->';
            const body = `${marker}\n### 👀 Preview\n\n[Open interactive preview in StackBlitz](${url})`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100
            });

            const existingComment = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.payload.pull_request.number,
              body
            });
